<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.containor{
     width: 350px;
    margin: 24px auto;
    background-color: #959497;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 1px 12px black;
}

.title{
      display: flex;
    justify-content: space-between;
    color: white;
    font-size: 18px;
    margin-bottom: 24px;
}
.inputToContainor{
     width: 100%;
    height: 64px;
    background-color: rgb(44, 3, 249);
    padding: 4px;
    border-radius: 4px;
    margin-bottom: 24px;
}

.inputToContainor label{
     display: block;
    text-align: right;
    font-weight: bold;
    color:white;
}

.inputToContainor input{
    display: block;
    width: 100%;
    height: 38px;
    border: none;
    text-align: end;
    outline: none;
    font-size: 24px;
    font-weight: bold;
    background-color: transparent;
}

.inputToContainor input:focus{
     border: none;
   outline: none;
   box-shadow: none;
}

 hr{
    height: 1px;
    background-color: rgb(201, 201, 201, 1);
    margin: 24px 0;
    border: 6px;
}

.mainContainor{
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
}

.main{
     display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.equal{
    grid-column: span 2;
}

.button{
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 4px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.utility{
    background-color: rgb(44, 3, 249);
}

.operator{
    background-color: black;
    color:white;
}

.number{
    background-color: rgb(86, 84, 96);
    color: white;
}

.equal{
    background-color:red;
    color:white;
}
    </style>

</head>
<body>
    <div class="containor">
        <div class="title">
            <h3>Standard</h3>
            <h2>JO</h2>
        </div>
        <div class="inputToContainor">
            <label>counts</label>
             <input type="text" id="display" class="display" value="0" readonly/>
        </div>
        <hr/>
        <div class="mainContainor">
            <div class="main">
            <button onclick="clearDisplay()" class="utility">AC</button>
            <button onclick="toggleSign()" class="utility">+\-</button>
            <button onclick="percentage()" class="utility">%</button>
            <button onclick="selectOperator('/')" class="operator">/</button>
        </div>
        <div class="main">
            <button onclick="appendNum('7')" class="number">7</button>
            <button onclick="appendNum('8')" class="number">8</button>
            <button onclick="appendNum('9')" class="number">9</button>
            <button onclick="selectOperator('*')" class="operator">x</button>
        </div>
        <div class="main">
            <button onclick="appendNum('6')" class="number">6</button>
            <button onclick="appendNum('5')" class="number">5</button>
            <button onclick="appendNum('4')" class="number">4</button>
            <button onclick="selectOperator('-')" class="operator">-</button>
        </div>
        <div class="main">
            <button onclick="appendNum('3')" class="number">3</button>
            <button onclick="appendNum('2')" class="number">2</button>
            <button onclick="appendNum('1')" class="number">1</button>
            <button onclick="selectOperator('+')" class="operator">+</button>
        </div>
        <div class="main">
            <button onclick="appendNum('0')" class="number">0</button>
            <button onclick="appendNum('.')" class="number">.</button>
            <button onclick="calculate()" class="equal">=</button>
        </div>
        </div>
    </div>
</body>
<script>
let display = document.getElementById('display');
let current = "";          // the number being typed now
let previous = "";         // the first number
let operator = "";         // + - * /
let justCalculated = false; // true right after pressing "="

// Show the whole expression, e.g. "5 + 3"
function updateDisplay() {
    const symbols = { '+': '+', '-': '-', '*': 'x', '/': '/' };
    let text = previous;
    if (operator) text += " " + symbols[operator] + " ";
    text += current;
    display.value = text || "0";
}

// Number or "." clicked
function appendNum(num) {
    // After "=", typing a number starts a new calculation
    if (justCalculated) {
        current = "";
        justCalculated = false;
    }

    // Only one decimal point per number
    if (num === '.') {
        if (current.includes('.')) return;
        if (current === "") current = "0";
    }

    // Avoid numbers like 007
    if (current === "0" && num !== '.') {
        current = num;
    } else {
        current += num;
    }
    updateDisplay();
}

// Operator clicked
function selectOperator(op) {
    if (current === "" && previous === "") return;   // nothing to operate on

    // Only changed our mind about the operator (e.g. pressed + then -)
    if (current === "" && previous !== "") {
        operator = op;
        updateDisplay();
        return;
    }

    // Chain calculation: 5 + 3 then + => calculate 8 first
    if (previous !== "" && operator !== "") {
        const value = compute(parseFloat(previous), parseFloat(current), operator);
        if (value === "Error") return showError();
        previous = String(value);
    } else {
        previous = current;
    }

    current = "";
    operator = op;
    justCalculated = false;
    updateDisplay();
}

// Do the math
function compute(a, b, op) {
    let value;
    switch (op) {
        case '+': value = a + b; break;
        case '-': value = a - b; break;
        case '*': value = a * b; break;
        case '/':
            if (b === 0) return "Error";   // cannot divide by zero
            value = a / b;
            break;
        default: return "Error";
    }
    // Fix tiny errors like 0.1 + 0.2 = 0.30000000000000004
    return parseFloat(value.toFixed(10));
}

// "=" clicked
function calculate() {
    if (previous === "" || current === "" || operator === "") return;

    const value = compute(parseFloat(previous), parseFloat(current), operator);
    if (value === "Error") return showError();

    current = String(value);
    previous = "";
    operator = "";
    justCalculated = true;
    updateDisplay();
}

// +/- clicked: change the sign of the current number
function toggleSign() {
    if (current === "" || current === "0") return;
    current = current.startsWith("-") ? current.slice(1) : "-" + current;
    updateDisplay();
}

// % clicked: divide the current number by 100
function percentage() {
    if (current === "") return;
    current = String(parseFloat(current) / 100);
    updateDisplay();
}

// AC clicked: reset everything
function clearDisplay() {
    current = "";
    previous = "";
    operator = "";
    justCalculated = false;
    display.value = "0";
}

function showError() {
    clearDisplay();
    display.value = "Error";
}
</script>
</html>
